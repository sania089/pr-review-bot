# Render Blueprint: New > Blueprint in the Render dashboard and pick this repo.
# Secrets are marked sync: false, so Render asks for them and they never live in git.
services:
  - type: web
    name: pr-review-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass # deploy from main only after GitHub CI is green
    branch: main
    envVars:
      - key: GITHUB_AUTH
        value: app
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
