spring:
  config:
    # Local development only: reads KEY=VALUE lines from ./.env if the file exists (it is git-ignored).
    import: "optional:file:./.env[.properties]"

  # Neon scales to zero, so keep the pool tiny and give the first connection time to wake the DB.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/prbot}
    username: ${DB_USER:prbot}
    password: ${DB_PASSWORD:prbot}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout: 20000
      idle-timeout: 60000
      max-lifetime: 300000

server:
  port: 8080

prbot:
  github-token: ${GITHUB_TOKEN:}
  webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
  max-diff-chars: 60000
  max-comments: 15
  llm:
    provider: ${LLM_PROVIDER:gemini}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: gemini-3.5-flash-lite
    groq:
      api-key: ${GROQ_API_KEY:}
      model: openai/gpt-oss-120b
    claude:
      api-key: ${ANTHROPIC_API_KEY:}
      model: claude-sonnet-5-5
  executor:
    threads: 2
    queue-capacity: 20

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

management:
  health:
    db:
      # The uptime pinger hits /actuator/health every 5 minutes; checking the DB there would keep Neon awake.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
