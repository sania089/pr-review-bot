spring:
  config:
    # Local development only: reads KEY=VALUE lines from ./.env if the file exists (it is git-ignored).
    import: "optional:file:./.env[.properties]"

  # Neon scales to zero, so keep the pool tiny and give the first connection time to wake the DB.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/prbot}
    username: ${DB_USER:prbot}
    password: ${DB_PASSWORD:prbot}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout: 20000
      idle-timeout: 60000
      max-lifetime: 300000

server:
  port: 8080
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:true} # set false only for plain-http testing outside localhost

prbot:
  github:
    auth: ${GITHUB_AUTH:pat} # pat (local dev) or app (GitHub App, works across repos)
    token: ${GITHUB_TOKEN:}
    app-id: ${GITHUB_APP_ID:}
    app-private-key: ${GITHUB_APP_PRIVATE_KEY:} # PEM text; literal \n sequences are accepted
    api-url: https://api.github.com # only changed by tests, which point it at a fake server
  webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
  webhook:
    max-bytes: 1048576 # larger webhook bodies get 413; real pull request events are far smaller
  max-diff-chars: 60000
  max-comments: 15 # hard upper bound; .prbot.yml strictness can lower it
  max-batch-chars: 24000 # diff chars per model request; bigger PRs are reviewed in several requests
  quota: # defaults sit under the Gemini free tier of gemini-3.5-flash-lite (15 RPM, 500 RPD)
    requests-per-minute: 12
    daily-limit: 450
    reset-zone: America/Los_Angeles # the provider's daily quota resets at midnight in this zone
  llm:
    provider: ${LLM_PROVIDER:gemini}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: gemini-3.5-flash-lite
      base-url: https://generativelanguage.googleapis.com # only changed by tests
    groq:
      api-key: ${GROQ_API_KEY:}
      model: openai/gpt-oss-120b
    claude:
      api-key: ${ANTHROPIC_API_KEY:}
      model: claude-sonnet-5-5
  admin: # the one dashboard login (React app); the password has no default
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
  executor:
    threads: 2
    queue-capacity: 20

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

management:
  endpoint:
    health:
      show-details: when-authorized # the public pinger sees only UP/DOWN; a logged-in admin sees review counters
  health:
    db:
      # The uptime pinger hits /actuator/health every 5 minutes; checking the DB there would keep Neon awake.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
